version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps"
    groups:
      actions-non-major:
        update-types: ["minor", "patch"]

  # docker-compose ecosystem kept for future-proofing: all current `image:`
  # lines in compose.yaml are on rolling tags (`:latest` / `:stable`), so
  # Dependabot has no version to bump and will open no PRs for them. If a
  # future image is added with an explicit `:vX.Y.Z` tag, Dependabot will
  # pick it up automatically.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps"
    groups:
      images-non-major:
        update-types: ["minor", "patch"]
