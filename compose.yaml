# Torrent stack: Gluetun VPN gateway with qBittorrent, Jackett,
# FlareSolverr, FileBrowser, and Watchtower.
name: torrent-stack

services:

  # VPN gateway. All services that must stay off the host IP route through
  # this container's network namespace via network_mode: service:gluetun.
  gluetun:
    image: qmcgaw/gluetun:v3.41.3
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    # Ports for services sharing this network namespace must be published here,
    # not on each app container.
    ports:
      - ${QBIT_WEBUI_PORT}:${QBIT_WEBUI_PORT}/tcp
      - ${JACKETT_PORT}:${JACKETT_PORT}/tcp
      - ${FLARESOLVERR_PORT}:${FLARESOLVERR_PORT}/tcp
    volumes:
      - ${CONFIG_PATH}/gluetun:/gluetun
      - ./update-qbittorrent.sh:/gluetun/update-qbittorrent.sh:ro
    # DISABLE_IPV6 is NOT a Gluetun env var. The documented block is the
    # Docker-level sysctl below, which also propagates to every service on
    # network_mode: service:gluetun.
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
    environment:
      # --- VPN Selection ---
      VPN_SERVICE_PROVIDER: ${VPN_PROVIDER}
      VPN_TYPE: ${VPN_TYPE}
      # --- OpenVPN Credentials ---
      OPENVPN_USER: ${OPENVPN_USER}
      OPENVPN_PASSWORD: ${OPENVPN_PASSWORD}
      OPENVPN_PROTOCOL: ${OPENVPN_PROTOCOL}
      # --- WireGuard Credentials ---
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES}
      # --- General VPN Settings ---
      PORT_FORWARD_ONLY: ${PORT_FORWARD_ONLY}
      VPN_PORT_FORWARDING: ${VPN_PORT_FORWARDING}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES}
      TZ: ${TZ}
      # --- Script Integration ---
      VPN_PORT_FORWARDING_UP_COMMAND: /gluetun/update-qbittorrent.sh
      QBIT_WEBUI_PORT: ${QBIT_WEBUI_PORT}
      QBITTORRENT_USER: ${QBITTORRENT_USER}
      QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD}
      SCRIPT_NOTIFY_URL: ${SCRIPT_NOTIFY_URL}
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.scope=torrent-stack"

  # Cloudflare challenge solver for Jackett.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info
    volumes:
      - ${CONFIG_PATH}/flaresolverr:/config
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.scope=torrent-stack"

  # qBittorrent client. Image uses LinuxServer rolling tags — pin to a specific
  # release and bump via Watchtower or manually. See
  # https://github.com/linuxserver/docker-qbittorrent/releases
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    network_mode: service:gluetun
    environment:
      WEBUI_PORT: ${QBIT_WEBUI_PORT}
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      # VueTorrent WebUI theme installed via LinuxServer docker-mod.
      DOCKER_MODS: ghcr.io/vuetorrent/vuetorrent-lsio-mod:latest
    volumes:
      - ${CONFIG_PATH}/qbittorrent:/config
      - ${DOWNLOADS_PATH}:/downloads
      - ${INCOMPLETE_DOWNLOADS}:/downloads/incomplete
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.scope=torrent-stack"

  # Jackett indexer proxy.
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${CONFIG_PATH}/jackett:/config
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.scope=torrent-stack"

  # Watchtower: containrrr was archived Dec 2025 at v1.7.1; switched to
  # nicholas-fedor's active community fork, drop-in compatible on env and
  # labels. Not fronted by docker-socket-proxy here because this instance
  # performs updates (recreate requires POST /containers/create), so a
  # read-only proxy would need to allow POST and would not meaningfully
  # reduce authority. The paired docker-pve stack places a POST=0 proxy
  # in front of its monitor-only watchtower where it does pay off.
  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:v1.23.2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Modern Watchtower auto-detects shoutrrr from the URL scheme, so
    # WATCHTOWER_NOTIFICATIONS is not needed.
    environment:
      WATCHTOWER_NOTIFICATION_URL: ${WATCHTOWER_NOTIFICATION_URL}
      WATCHTOWER_NOTIFICATION_LEVEL: ${WATCHTOWER_NOTIFICATION_LEVEL}
      WATCHTOWER_NOTIFICATION_TITLE_TAG: ${WATCHTOWER_TITLE_TAG}
      TZ: ${TZ}
      WATCHTOWER_SCOPE: torrent-stack
      WATCHTOWER_SCHEDULE: ${WATCHTOWER_SCHEDULE}
    command: --cleanup
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.scope=torrent-stack"

  # Web-based file manager. Scoped to the downloads tree only — do NOT mount
  # the project root or the configs tree here, both contain secrets (.env,
  # VPN keys, qBittorrent session cookies, Jackett APIKey).
  filebrowser:
    image: ghcr.io/gtsteffaniak/filebrowser:2.0.2-stable
    environment:
      TZ: ${TZ}
    ports:
      - ${FILEBROWSER_PORT}:80/tcp
    volumes:
      - ${CONFIG_PATH}/filebrowser:/config
      - ${DOWNLOADS_PATH}:/srv/downloads
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.scope=torrent-stack"
